name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore AssyCheck.Test/AssyCheck.Test.csproj

      - name: Build
        run: dotnet build AssyCheck.Test/AssyCheck.Test.csproj --configuration Release --no-restore

      - name: Run dependency smoke test
        run: .\AssyCheck.Test\bin\Release\net472\AssyCheck.Test.exe
